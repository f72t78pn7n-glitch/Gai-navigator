<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Навигатор постов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --ink:#151a21; --amber:#ffb400; --red:#e5383b; --green:#2fbf71;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:var(--ink); overflow:hidden; }
  #map { position:absolute; inset:0; }

  #banner { position:absolute; left:10px; right:10px; top:calc(env(safe-area-inset-top,0px) + 10px);
    z-index:1000; border-radius:16px; padding:14px 16px; background:var(--ink); color:#fff;
    display:flex; align-items:center; gap:14px; box-shadow:0 6px 24px rgba(0,0,0,.35);
    border-left:8px solid var(--amber); }
  #banner.warn { border-left-color:var(--amber); }
  #banner.danger { border-left-color:var(--red); background:#3a1416; animation:pulse .8s ease-in-out infinite alternate; }
  #banner .big { font-size:34px; font-weight:800; line-height:1; min-width:108px; font-variant-numeric:tabular-nums; }
  #banner .txt { font-size:15px; line-height:1.25; opacity:.9; }
  #banner .txt b { display:block; font-size:17px; opacity:1; }
  #banner.idle .big { font-size:22px; min-width:0; }
  @keyframes pulse { from { box-shadow:0 0 0 0 rgba(229,56,59,0), 0 6px 24px rgba(0,0,0,.35); } to { box-shadow:0 0 0 6px rgba(229,56,59,.45), 0 6px 24px rgba(0,0,0,.35); } }
  @media (prefers-reduced-motion: reduce) { #banner.danger { animation:none; } }

  #tools { position:absolute; right:10px; top:calc(env(safe-area-inset-top,0px) + 118px); z-index:1000;
    display:flex; flex-direction:column; gap:8px; }
  #tools button { width:62px; height:46px; border:0; border-radius:12px; background:var(--ink); color:#fff;
    font-size:12px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  #tools button.on { background:var(--amber); color:var(--ink); }

  #bar { position:absolute; left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    z-index:1000; display:flex; gap:8px; }
  #bar button { flex:1; border:0; border-radius:14px; padding:15px 8px; font-size:15px; font-weight:700;
    color:#fff; background:var(--ink); box-shadow:0 4px 16px rgba(0,0,0,.3); }
  #bar button:active, #tools button:active { transform:scale(.97); }
  #bar button:focus-visible, #tools button:focus-visible { outline:3px solid var(--amber); outline-offset:2px; }
  #btnStart { background:var(--amber) !important; color:var(--ink) !important; flex:2 !important; }
  #btnStart.on { background:var(--green) !important; color:#fff !important; }
  #status { position:absolute; left:12px; z-index:1000; font-size:12px; color:#fff;
    bottom:calc(env(safe-area-inset-bottom,0px) + 74px); background:rgba(21,26,33,.8);
    padding:4px 10px; border-radius:10px; }

  .mk { transform:translate(-50%,-50%); padding:6px; cursor:pointer; }
  .pt { font-size:28px; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); text-align:center; }
  .mk.old .pt { opacity:.55; }
  .me-wrap { width:34px; height:34px; display:grid; place-items:center; }
  .me-arrow { width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent;
    border-bottom:26px solid #2d7ff9; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); transition:transform .3s; }

  #sheet { position:absolute; left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 110px);
    z-index:1500; background:var(--ink); color:#fff; border-radius:16px; padding:14px 16px;
    box-shadow:0 6px 24px rgba(0,0,0,.45); }
  #sheet b { display:block; font-size:17px; margin-bottom:2px; }
  #sheet small { opacity:.75; }
  #sheet .row { display:flex; gap:8px; margin-top:12px; }
  #sheet button { flex:1; border:0; border-radius:10px; padding:12px 6px; font-weight:700; font-size:15px;
    background:#2b3440; color:#fff; }
  #sheet #shClose { flex:0 0 52px; }

  #toast { position:absolute; left:50%; transform:translateX(-50%); z-index:2000;
    bottom:calc(env(safe-area-inset-bottom,0px) + 110px); background:var(--ink); color:#fff;
    padding:10px 16px; border-radius:12px; font-size:14px; opacity:0; pointer-events:none;
    transition:opacity .2s; max-width:90%; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div id="map"></div>

<div id="banner" class="idle warn">
  <div class="big">🚓</div>
  <div class="txt"><b>Нажмите «Старт»</b>Включится слежение за позицией и звук</div>
</div>

<div id="tools">
  <button id="btnMode">2D</button>
  <button id="btnSat">Схема</button>
  <button id="btnTraffic">Пробки</button>
  <button id="btnEvents">События</button>
</div>

<div id="sheet" hidden>
  <b id="shTitle">🚓 Пост ГАИ</b><small id="shMeta"></small>
  <div class="row">
    <button id="shUp">👍 Стоит</button>
    <button id="shDown">👎 Нет</button>
    <button id="shClose" aria-label="Закрыть">✕</button>
  </div>
</div>

<div id="status">GPS: ожидание…</div>

<div id="bar">
  <button id="btnStart">▶ Старт</button>
  <button id="btnAdd">➕ Пост</button>
  <button id="btnFollow" aria-label="К моей позиции">🎯</button>
</div>
<div id="toast"></div>

<script>
// ───── ВСТАВЬТЕ СВОЙ КЛЮЧ ЯНДЕКС КАРТ ─────
const YKEY = 'de83d1ec-ae1d-4072-be81-d53aad446a97';

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes?.(); } catch (e) {} }

const THRESHOLDS = [1000, 500, 200];
const FRONT_ANGLE = 70;
const LOAD_RADIUS = 5000;
const POLL_MS = 5000;
const DEG = Math.PI / 180;

let me = null, prev = null, points = [];
let started = false, follow = true, watchId = null, wakeLock = null, audioCtx = null;
const alerted = new Set();
const markers = new Map();

let map, YMapMarker, schemeLayer, satLayer, trafficLayer, eventsLayer, extraMod;
let meMarker, meOnMap = false;
let mapType = 'scheme', is3d = false, trafficOn = false, eventsOn = false, selId = null;

const $ = id => document.getElementById(id);
const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
function dist(a, b, c, d) {
  const R = 6371000, dp = toRad(c - a), dl = toRad(d - b);
  const x = Math.sin(dp / 2) ** 2 + Math.cos(toRad(a)) * Math.cos(toRad(c)) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(a, b, c, d) {
  const y = Math.sin(toRad(d - b)) * Math.cos(toRad(c));
  const x = Math.cos(toRad(a)) * Math.sin(toRad(c)) - Math.sin(toRad(a)) * Math.cos(toRad(c)) * Math.cos(toRad(d - b));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}
const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
const fmtDist = m => m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' км' : Math.round(m) + ' м';
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2400); }

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg?.initData || '', ...(opts.headers || {}) } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}

// ───── Звук / вибрация / голос ─────
function initAudio() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {} }
function beep(times = 1, freq = 880) {
  if (!audioCtx) return;
  for (let i = 0; i < times; i++) {
    const t = audioCtx.currentTime + i * 0.28;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.25);
  }
}
function speak(text) {
  try { if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ru-RU'; u.rate = 1.05;
    speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function notify(level) {
  const times = level <= 200 ? 3 : level <= 500 ? 2 : 1;
  beep(times, level <= 200 ? 1040 : 880);
  try { tg?.HapticFeedback?.notificationOccurred(level <= 200 ? 'error' : 'warning'); } catch (e) {}
  try { navigator.vibrate?.(level <= 200 ? [200, 100, 200, 100, 200] : [250]); } catch (e) {}
  speak(`Впереди пост, ${level} метров`);
}

// ───── Карта (Яндекс) ─────
function loadYandex() {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = `https://api-maps.yandex.ru/v3/?apikey=${encodeURIComponent(YKEY)}&lang=ru_RU`;
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function initMap() {
  await ymaps3.ready;
  const { YMap, YMapDefaultSchemeLayer, YMapDefaultFeaturesLayer } = ymaps3;
  YMapMarker = ymaps3.YMapMarker;
  schemeLayer = new YMapDefaultSchemeLayer({});
  map = new YMap($('map'),
    { location: { center: [60.63, 41.55], zoom: 12 }, camera: { tilt: 0, azimuth: 0 } },
    [schemeLayer, new YMapDefaultFeaturesLayer({})]);

  const meEl = document.createElement('div');
  meEl.className = 'mk'; meEl.style.pointerEvents = 'none';
  meEl.innerHTML = '<div class="me-wrap"><div class="me-arrow" id="meArrow"></div></div>';
  meMarker = new YMapMarker({ coordinates: [60.63, 41.55] }, meEl);

  if (!ymaps3.YMapDefaultSatelliteLayer) $('btnSat').hidden = true;

  const stop = () => { follow = false; };
  $('map').addEventListener('touchstart', stop, { passive: true });
  $('map').addEventListener('pointerdown', stop, { passive: true });
}
function flyTo(lat, lon, zoom, dur = 500) {
  map.setLocation({ center: [lon, lat], zoom: zoom ?? map.zoom, duration: dur });
}
function setMapType(t) {
  if (t === mapType) return;
  if (t === 'sat') {
    if (!ymaps3.YMapDefaultSatelliteLayer) { toast('Спутник недоступен'); return; }
    map.removeChild(schemeLayer);
    satLayer = satLayer || new ymaps3.YMapDefaultSatelliteLayer({});
    map.addChild(satLayer);
  } else {
    map.removeChild(satLayer);
    map.addChild(schemeLayer);
  }
  mapType = t;
  $('btnSat').textContent = t === 'sat' ? 'Спутн.' : 'Схема';
  $('btnSat').classList.toggle('on', t === 'sat');
}
function set3d(on) {
  is3d = on;
  map.update({ camera: { tilt: (on ? 55 : 0) * DEG, duration: 400 } });
  $('btnMode').textContent = on ? '3D' : '2D';
  $('btnMode').classList.toggle('on', on);
}
async function getExtra() {
  extraMod = extraMod || await ymaps3.import('@yandex/ymaps3-layers-extra');
  return extraMod;
}
async function toggleTraffic() {
  try {
    const ex = await getExtra();
    trafficLayer = trafficLayer || new ex.YMapTrafficLayer({});
    trafficOn = !trafficOn;
    trafficOn ? map.addChild(trafficLayer) : map.removeChild(trafficLayer);
    $('btnTraffic').classList.toggle('on', trafficOn);
  } catch (e) { trafficOn = false; toast('Пробки недоступны для этого ключа'); }
}
async function toggleEvents() {
  try {
    const ex = await getExtra();
    eventsLayer = eventsLayer || new ex.YMapTrafficEventsLayer({});
    eventsOn = !eventsOn;
    eventsOn ? map.addChild(eventsLayer) : map.removeChild(eventsLayer);
    $('btnEvents').classList.toggle('on', eventsOn);
  } catch (e) { eventsOn = false; toast('События недоступны для этого ключа'); }
}

// ───── Геопозиция ─────
function onPos(p) {
  const c = p.coords;
  let heading = (c.heading != null && !isNaN(c.heading) && (c.speed ?? 0) > 1) ? c.heading : null;
  if (heading == null && prev && dist(prev.lat, prev.lon, c.latitude, c.longitude) > 12) {
    heading = bearing(prev.lat, prev.lon, c.latitude, c.longitude);
  }
  if (heading == null && me) heading = me.heading;
  if (!prev || dist(prev.lat, prev.lon, c.latitude, c.longitude) > 12) prev = { lat: c.latitude, lon: c.longitude };
  const first = !me;
  me = { lat: c.latitude, lon: c.longitude, heading, speed: c.speed };

  meMarker.update({ coordinates: [me.lon, me.lat] });
  if (!meOnMap) { map.addChild(meMarker); meOnMap = true; }
  const arrow = $('meArrow'); if (arrow && heading != null) arrow.style.transform = `rotate(${heading}deg)`;
  if (first) { flyTo(me.lat, me.lon, 16, 0); loadPoints(); }
  else if (follow) flyTo(me.lat, me.lon, undefined, 900);

  const kmh = c.speed != null ? Math.round(c.speed * 3.6) : null;
  $('status').textContent = `GPS ±${Math.round(c.accuracy)} м` + (kmh != null ? ` · ${kmh} км/ч` : '');
  checkAlerts();
}
function onPosErr() { $('status').textContent = 'GPS: нет доступа — разрешите геолокацию'; }
function startWatch() {
  if (watchId != null) return;
  if (!navigator.geolocation) { toast('Геолокация недоступна'); return; }
  watchId = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}

// ───── Точки ─────
async function loadPoints() {
  if (!me) return;
  try {
    const r = await api(`/api/points?lat=${me.lat}&lon=${me.lon}&radius=${LOAD_RADIUS}`);
    points = r.points; renderMarkers(); checkAlerts();
  } catch (e) { $('status').textContent = 'Нет связи с сервером'; }
}
function mkPointEl(p) {
  const w = document.createElement('div');
  w.className = 'mk'; w.innerHTML = '<div class="pt">🚓</div>';
  w.addEventListener('click', e => { e.stopPropagation(); openSheet(p.id); });
  return w;
}
function renderMarkers() {
  const ids = new Set(points.map(p => p.id));
  for (const [id, o] of markers) if (!ids.has(id)) {
    map.removeChild(o.marker); markers.delete(id);
    if (selId === id) closeSheet();
  }
  for (const p of points) {
    let o = markers.get(p.id);
    if (!o) {
      const el = mkPointEl(p);
      const marker = new YMapMarker({ coordinates: [p.lon, p.lat] }, el);
      map.addChild(marker); o = { marker, el }; markers.set(p.id, o);
    } else o.marker.update({ coordinates: [p.lon, p.lat] });
    o.el.classList.toggle('old', p.age_min > 60);
  }
}
function openSheet(id) {
  const p = points.find(x => x.id === id); if (!p) return;
  selId = id;
  const d = me ? ' · ' + fmtDist(dist(me.lat, me.lon, p.lat, p.lon)) : '';
  $('shMeta').textContent = `${p.user_name || '—'} · ${p.age_min} мин назад${d}`;
  $('sheet').hidden = false;
}
function closeSheet() { selId = null; $('sheet').hidden = true; }
async function vote(id, v) {
  try {
    await api(`/api/points/${id}/vote`, { method: 'POST', body: JSON.stringify({ value: v }) });
    toast(v > 0 ? 'Спасибо, пост подтверждён' : 'Принято'); closeSheet(); loadPoints();
  } catch (e) { toast('Ошибка: ' + e.message); }
}

// ───── Предупреждения ─────
function angleOK(p) { return angDiff(bearing(me.lat, me.lon, p.lat, p.lon), me.heading) <= FRONT_ANGLE; }
function checkAlerts() {
  if (!me) return;
  const ahead = [];
  for (const p of points) {
    const d = dist(me.lat, me.lon, p.lat, p.lon);
    const isAhead = me.heading == null || d < 60 || angleOK(p);
    if (d > 1300 || !isAhead) { for (const t of THRESHOLDS) alerted.delete(`${p.id}:${t}`); }
    if (d <= 1000 && isAhead) ahead.push({ p, d });
  }
  ahead.sort((a, b) => a.d - b.d);
  if (started) {
    for (const { p, d } of ahead) {
      const level = THRESHOLDS.slice().reverse().find(t => d <= t);
      if (!level) continue;
      const key = `${p.id}:${level}`;
      if (alerted.has(key)) continue;
      for (const t of THRESHOLDS) if (t >= level) alerted.add(`${p.id}:${t}`);
      notify(level);
    }
  }
  renderBanner(ahead);
}
function renderBanner(ahead) {
  const el = $('banner');
  if (!started) return;
  if (!ahead.length) {
    el.className = 'idle warn';
    el.innerHTML = '<div class="big">✅</div><div class="txt"><b>Впереди чисто</b>Постов в радиусе 1 км нет</div>';
    return;
  }
  const { p, d } = ahead[0];
  const sub = ahead.length > 1 ? 'Ещё постов: ' + (ahead.length - 1) : (p.age_min + ' мин назад');
  el.className = d <= 300 ? 'danger' : 'warn';
  el.innerHTML = `<div class="big">${fmtDist(d)}</div><div class="txt"><b>Пост ГАИ впереди</b>${sub}</div>`;
}

// ───── Кнопки ─────
$('btnStart').onclick = async () => {
  const b = $('btnStart');
  if (!started) {
    started = true; initAudio(); startWatch(); beep(1, 660);
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
    b.textContent = '■ Стоп'; b.classList.add('on');
    $('banner').className = 'idle warn';
    $('banner').innerHTML = '<div class="big">📡</div><div class="txt"><b>Ищем вас…</b>Ждём сигнал GPS</div>';
    checkAlerts();
  } else {
    started = false; b.textContent = '▶ Старт'; b.classList.remove('on');
    try { await wakeLock?.release(); } catch (e) {} wakeLock = null;
    $('banner').className = 'idle warn';
    $('banner').innerHTML = '<div class="big">🚓</div><div class="txt"><b>Предупреждения выключены</b>Нажмите «Старт», чтобы включить</div>';
  }
};
$('btnAdd').onclick = () => {
  if (!me) { toast('Сначала дождитесь GPS'); return; }
  const go = async () => {
    try { await api('/api/points', { method: 'POST', body: JSON.stringify({ lat: me.lat, lon: me.lon }) }); toast('Пост добавлен'); loadPoints(); }
    catch (e) { toast('Ошибка: ' + e.message); }
  };
  if (tg?.showConfirm) tg.showConfirm('Отметить пост ГАИ в вашей позиции?', ok => ok && go()); else go();
};
$('btnFollow').onclick = () => { follow = true; if (me) flyTo(me.lat, me.lon, Math.max(map.zoom, 16), 500); };
$('btnMode').onclick = () => set3d(!is3d);
$('btnSat').onclick = () => setMapType(mapType === 'sat' ? 'scheme' : 'sat');
$('btnTraffic').onclick = toggleTraffic;
$('btnEvents').onclick = toggleEvents;
$('shUp').onclick = () => selId != null && vote(selId, 1);
$('shDown').onclick = () => selId != null && vote(selId, -1);
$('shClose').onclick = closeSheet;

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && started) { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {} }
});

// ───── Запуск ─────
(async () => {
  if (YKEY.startsWith('ВСТАВЬТЕ')) {
    $('banner').innerHTML = '<div class="big">🔑</div><div class="txt"><b>Нужен ключ Яндекс Карт</b>Вставьте его в строку YKEY в index.html</div>';
    return;
  }
  try { await loadYandex(); await initMap(); }
  catch (e) {
    $('banner').innerHTML = '<div class="big">⚠️</div><div class="txt"><b>Карта не загрузилась</b>Проверьте ключ и ограничения по домену</div>';
    return;
  }
  startWatch();
  setInterval(loadPoints, POLL_MS);
})();
</script>
</body>
</html>
